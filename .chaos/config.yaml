version: 0.1

# Lockstep version of the CHAOS machinery this workspace was initialized against.
# Read from the installed plugin's .claude-plugin/plugin.json. The machinery is NOT
# vendored in this repository — it installs as a Claude Code plugin. chaos:doctor warns
# when this drifts from the installed version.
machineryVersion: "0.2.1"

# Repository conventions for the Task Tracker demo API.
#
# Conventions only: where things live, which tools must exist, which commands validate the
# repository, and the non-secret policy switches. This file is deliberately NOT a second
# source of architectural truth — postures live in .chaos/architecture.md and docs/adr/,
# and what actually happened lives in .chaos/decisions/.

project:
  name: "TaskTracker"
  type: dotnet
  primaryLanguage: csharp
  specEngine: openspec

paths:
  chaos: .chaos
  openspec: openspec
  adrs: docs/adr
  # One decision record per chaos:run change, plus index.md.
  decisions: .chaos/decisions

toolchain:
  git:
    required: true
    command: git --version

  dotnet:
    # The solution targets net8.0 (src/TaskTracker.Api, tests/TaskTracker.Tests) and CI
    # pins 8.0.x. A newer SDK builds it fine; older than 8.0 does not.
    required: true
    minimumVersion: "8.0.0"
    command: dotnet --version

  node:
    # Required twice over: it is the OpenSpec CLI runtime, and the CHAOS plugin launches
    # the interaction runtime through npx. Without it the pre-code stop degrades to
    # chat-interactive — the stop still happens and the record is still written.
    required: true
    minimumVersion: "20.19.0"
    command: node --version

  npm:
    required: true
    command: npm --version

  openspec:
    required: true
    command: openspec --version
    installCommand: npm install -g @fission-ai/openspec@latest
    projectMarker: openspec
    initCommand: openspec init

validation:
  # Both commands are taken from .github/workflows/ci.yml, so a local verify runs exactly
  # what CI runs.
  build:
    defaultCommand: dotnet build TaskTracker.sln --nologo
    allowPrompt: true

  test:
    defaultCommand: dotnet test TaskTracker.sln --nologo
    allowPrompt: true

  openspec:
    validateCommand: openspec validate
    strictFlag: --strict

# When chaos:run owes an OpenSpec change. Evaluated and shown at the pre-code stop, so the
# human sees the gate result before approving rather than discovering it afterwards.
specGate:
  files: 5                 # estimated files touched >= this -> spec owed
  loc: 250                 # estimated LOC >= this -> spec owed
  crossingsAlwaysOwe: true # any architecture/contract crossing -> spec owed, regardless of size

policies:
  protectedFiles:
    # Neither file may be edited silently. Commands may propose a patch; a semantic change
    # requires explicit human confirmation.
    agentsMd:
      path: AGENTS.md
      requirePatchPreview: true
      writeRequiresConfirmation: true

    rootReadme:
      path: README.md
      requirePatchPreview: true
      writeRequiresConfirmation: true

  interactionRuntime:
    commands:
      # true -> chaos:run creates its folded pre-code decision through the runtime and it
      # appears in the Decision Center. Requires the MCP server, which the CHAOS plugin
      # launches via npx. If it is unavailable the stop falls back to chat-interactive;
      # it is never silently skipped.
      enabled: true
      decisionBatching: batch-independent
      fallbackWhenDisabled: chat-interactive
    autoResume:
      # Conservative init defaults: after answering in the Decision Center you continue
      # with /chaos:resume. Set inSessionResume: true to have the answered decision
      # continue the same chat session automatically.
      enabled: true
      adapter: none
      inSessionResume: true
