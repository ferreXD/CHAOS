version: 0.1

# Lockstep version of the CHAOS machinery this workspace was initialized/migrated against.
# The machinery itself is NOT vendored here — it is installed as a Claude Code plugin.
machineryVersion: "0.2.0"

# Repository conventions for the Task Tracker demo. Conventions only: where things live,
# which tools exist, and the non-secret policy switches. Never a second source of
# architectural truth (that lives in .chaos/architecture.md and docs/adr/).

project:
  name: "TaskTracker"
  type: dotnet
  primaryLanguage: csharp
  specEngine: openspec

paths:
  chaos: .chaos
  openspec: openspec
  adrs: docs/adr
  # One decision record per chaos:run change (plus index.md).
  decisions: .chaos/decisions

toolchain:
  git:
    required: true
    command: git --version

  dotnet:
    required: true
    minimumVersion: "8.0.0"
    command: dotnet --version

  node:
    # Only needed for the CHAOS interaction runtime, which the plugin launches via npx.
    required: false
    minimumVersion: "20.19.0"
    command: node --version

  openspec:
    required: true
    command: openspec --version
    installCommand: npm install -g @fission-ai/openspec@latest
    projectMarker: openspec
    initCommand: openspec init

validation:
  build:
    defaultCommand: dotnet build TaskTracker.sln
    allowPrompt: true

  test:
    defaultCommand: dotnet test TaskTracker.sln --nologo
    allowPrompt: true

  openspec:
    validateCommand: openspec validate
    strictFlag: --strict

# When chaos:run owes an OpenSpec change (evaluated and shown at the pre-code stop).
specGate:
  files: 5
  loc: 250
  crossingsAlwaysOwe: true

policies:
  protectedFiles:
    agentsMd:
      path: AGENTS.md
      requirePatchPreview: true
      writeRequiresConfirmation: true

    rootReadme:
      path: README.md
      requirePatchPreview: true
      writeRequiresConfirmation: true

  interactionRuntime:
    commands:
      # true → chaos:run creates its folded pre-code decision through the runtime and
      # hands off to the Decision Center / chaos:resume. Requires the MCP server, which
      # the CHAOS plugin launches via npx. Without it the stop runs chat-interactive and
      # the decision record is still written.
      enabled: true
      decisionBatching: batch-independent
      fallbackWhenDisabled: chat-interactive
    autoResume:
      enabled: true
      adapter: none
      inSessionResume: true
