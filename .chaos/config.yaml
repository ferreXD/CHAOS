version: 0.1

# Repository-conventions file for the lean CHAOS core (2026-08, tag `apparatus-final` holds
# the retired full-lifecycle era). Conventions only: where things live, which tools exist,
# and the non-secret policy switches the hooks/diagnostics read. Never a second source of
# architectural truth, never secrets.

project:
  name: "CHAOS"
  type: node
  primaryLanguage: typescript
  specEngine: openspec

paths:
  chaos: .chaos
  openspec: openspec
  adrs: docs/adr
  # One decision record per chaos:run change (plus index.md).
  decisions: .chaos/decisions

agents:
  claude:
    csharpSpecialist: chaos-csharp-implementation-specialist

toolchain:
  git:
    required: true
    command: git --version

  node:
    required: true
    minimumVersion: "20.19.0"
    command: node --version

  npm:
    required: true
    command: npm --version

  openspec:
    required: true
    command: openspec --version
    installCommand: npm install -g @fission-ai/openspec@latest
    # The OpenSpec CLI (above) is distinct from an initialized OpenSpec *project*.
    # chaos:run invokes OpenSpec when the spec gate says a change owes one, writing under
    # `openspec/changes/<id>/`, so the project must exist before the first gated run.
    # chaos:init scaffolds it by running `initCommand` when `projectMarker` is absent;
    # doctor CD-RT-07 is the safety net if init was skipped.
    projectMarker: openspec
    initCommand: openspec init

validation:
  build:
    defaultCommand: npm run build
    allowPrompt: true

  test:
    defaultCommand: npm test
    allowPrompt: true

  openspec:
    validateCommand: openspec validate
    strictFlag: --strict

# When chaos:run owes an OpenSpec change (evaluated and shown at the pre-code stop).
# Standing demotion rule (operator, 2026-08-05): if the spec path visibly balloons wall
# time, demote OpenSpec to optional-everywhere and record the observation.
specGate:
  files: 5
  loc: 250
  crossingsAlwaysOwe: true

policies:
  protectedFiles:
    agentsMd:
      path: AGENTS.md
      requirePatchPreview: true
      writeRequiresConfirmation: true

    rootReadme:
      path: README.md
      requirePatchPreview: true
      writeRequiresConfirmation: true

  # Claude Code hook capability: CHAOS-owned Markdown artifact provenance metadata.
  # Canonical contract: .claude/hooks/reference/artifact-metadata-hook-policy.md.
  # Hooks are OPTIONAL tooling — this policy declares intent only; no hook is wired into
  # committed settings.json by default (see .claude/hooks/settings.artifact-metadata.example.json).
  artifactMetadata:
    enabled: true
    requireOnChaosMarkdown: true
    identityMode: provider-username # provider-username | git-name | git-email | configured-alias | anonymous
    configuredAlias: ""
    includeRepositoryContext: true
    updateTimestampOnlyOnMaterialChange: true
    allowAuditOnlyStamp: false
    stampSharedNonChaosFiles: false
    failOnMissingMetadataInStrictHooks: true
    warnOnMissingMetadataInContributorHooks: true

  artifactMetadataManagedFiles:
    # Manage ONLY the lean-core artifact set the hook can infer (see infer_artifact() in
    # scripts/chaos-artifact-metadata-hook.py). Never a broad ".chaos/**/*.md" — that
    # first-stamps hand-authored docs (validation records) as artifactType:unknown.
    include:
      - ".chaos/decisions/**/*.md"
      - ".chaos/bootstrap-report.md"
      - ".chaos/architecture.md"
      - ".chaos/context.md"
    optional:
      - "docs/adr/**/*.md"
    exclude:
      - "README.md"
      - "AGENTS.md"
      - ".chaos/validation/**/*.md"
      - ".chaos/interactions/**/*.md"

  # Claude Code hook capability: local runtime observability backbone (session/repository
  # context, active command, touched files, hook warnings, decision waits). Canonical
  # contract: .claude/hooks/reference/hook-runtime-policy.md. Report-only; observability,
  # not enforcement. Hooks are OPTIONAL tooling — no hook is wired into committed
  # settings.json by default (see .claude/hooks/settings.runtime-observability.example.json).
  hooks:
    runtimeObservability:
      enabled: true
      runtimePath: ".chaos/runtime"
      writeSessionContext: true
      writeActiveCommand: true
      auditTouchedFiles: true
      logHookViolations: true
      logDecisionWaits: true
      strictByDefault: false
      blockOnRuntimeErrors: false
      gitignoreRuntimePath: true

  # Interaction-runtime integration + health diagnostics. Canonical contracts:
  # .claude/skills/chaos-interaction-runtime/ and tools/chaos-interaction-diagnostics/.
  # Diagnostics are read-only; enforcement is report-first (advisory) and never performs
  # destructive repair. Violations reuse the hooks.runtimeObservability stream at
  # runtimePath/hook-violations.jsonl.
  interactionRuntime:
    commands:
      # Master switch. true → chaos:run preflights the runtime, creates its folded
      # pre-code decision through it, and hands off to the Decision Center / chaos:resume.
      # false → classic in-chat interactive decisions; no runtime decisions created.
      enabled: true
      # sequential → stop on the first material decision. batch-independent → create all
      # independent material decisions known up front, then stop once. The lean chaos:run
      # folds everything into ONE decision, so the modes coincide on the core loop.
      decisionBatching: batch-independent
      fallbackWhenDisabled: chat-interactive
    autoResume:
      # Master feature flag for the "answer → auto-continue" loop. Auto-resume only
      # happens when this is true AND a concrete mechanism below can drive the session.
      enabled: true
      # Headless runner adapter. none → manual chaos:resume only. mock → test/demo
      # adapter. claude-code → live headless session adapter (tools/chaos-interaction-runner/).
      adapter: none
      # In-session auto-resume for a normal interactive chat: the chaos-auto-resume Stop
      # hook keeps a chat-invoked command running in the SAME session across decisions.
      # Independent of `adapter`. See .claude/hooks/reference/in-session-auto-resume-contract.md.
      inSessionResume: true
    diagnostics:
      enabled: true
      staleDecisionAgeHours: 24
      staleLockAgeHours: 24
      expiredRunnerLeaseGraceMs: 30000
      includeTodoCandidates: true
      validateArtifacts: true
      checkMcpPackage: true
      checkDecisionCenterPackage: true
    enforcement:
      mode: advisory        # advisory | strict | off
      strictBlocksOnBlocker: true
      writeHookViolations: true
      blockOnPendingDecisionSameChange: false
      blockOnMalformedState: false

# Provider-neutral repository context + MCP integration. GitHub-native by default;
# Azure DevOps is a first-class internal provider. MCP is OPTIONAL — it improves context
# quality but is never a hard dependency; local git fallback always works. No secrets here.
integrations:
  repository:
    provider: auto            # auto | github | azure-devops | local-git
    contextResolution:
      preferMcp: true
      allowCliFallback: true
      allowGitFallback: true

    github:
      enabled: true
      mcp:
        preferred: true
        toolsets:
          - repos
          - pull_requests
          - issues
      cli:
        command: gh

    azureDevOps:
      enabled: false
      organization: "<your-azure-devops-org>"
      project: "<your-azure-devops-project>"
      mcp:
        preferred: true
        mode: remote          # remote | local
        domains:
          - core
          - repositories
          - work-items
      cli:
        command: az devops

# MCP security posture. Canonical contract:
# .claude/skills/chaos-shared/reference/mcp-security-policy.md
mcp:
  defaultMode: read-only
  remoteWritesRequireExplicitConfirmation: true
  preferLeastPrivilegeToolsets: true
  commandSpecificToolProfiles: true

# Command-specific least-privilege capability profiles. Canonical contract:
# .claude/skills/chaos-shared/reference/mcp-tool-profiles.md
mcpToolProfiles:
  doctor:
    github: [repos, pull_requests]
    azureDevOps: [core, repositories]
  run:
    github: [repos]
    azureDevOps: [core, repositories]
