# CI: tests + typecheck for the five Node packages across the three OSes,
# `dotnet test` for the C# task-tracker example, and the distribution checks
# (plugin sync, version lockstep, cold-start bundle smoke).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: node (${{ matrix.package }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # The five CHAOS packages. Each is self-contained: `npm ci` in its own
        # directory is enough (consumers import the runtime's TypeScript source
        # directly, which a full checkout provides).
        package:
          - tools/chaos-interaction-runtime
          - tools/chaos-interaction-mcp
          - tools/chaos-interaction-runner
          - tools/chaos-interaction-diagnostics
          - extensions/chaos-decision-center
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node 24: `node --test` strips TypeScript types by default (no flag),
          # matching the packages' `test` scripts. engines require >=22.6.0.
          node-version: '24'
          cache: npm
          cache-dependency-path: ${{ matrix.package }}/package-lock.json
      - name: Install
        working-directory: ${{ matrix.package }}
        run: npm ci
      - name: Typecheck
        working-directory: ${{ matrix.package }}
        run: npm run typecheck
      - name: Test
        working-directory: ${{ matrix.package }}
        run: npm test

  distribution:
    # The install-ladder reality check: generated plugin in sync with .claude/,
    # one version everywhere, and the published-shape bundle boots cold on every
    # OS (this is what `npx -y @ferrexd-chaos/interaction-mcp` will run).
    name: distribution (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tools/chaos-interaction-mcp/package-lock.json
      - name: Plugin in sync with .claude/
        run: node scripts/build-plugin.mjs --check
      - name: Version lockstep
        run: node scripts/set-version.mjs --check
      - name: Install (MCP package)
        working-directory: tools/chaos-interaction-mcp
        run: npm ci
      - name: Bundle
        working-directory: tools/chaos-interaction-mcp
        run: npm run bundle
      - name: Cold-start bundle smoke
        working-directory: tools/chaos-interaction-mcp
        run: npm run smoke:bundle

  dotnet:
    name: dotnet (task-tracker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          # The task-tracker example targets net8.0.
          dotnet-version: '8.0.x'
      - name: Test
        working-directory: examples/task-tracker/dotnet
        run: dotnet test --nologo
