# CI for the Task Tracker demo API. The CHAOS machinery is not vendored in this branch
# (it installs as a Claude Code plugin), so this builds and tests the app only.
name: CI

on:
  push:
    branches: [demo/dotnet]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dotnet:
    name: dotnet (task-tracker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          # The Task Tracker API targets net8.0.
          dotnet-version: '8.0.x'
      - name: Build
        run: dotnet build TaskTracker.sln --nologo
      - name: Test
        run: dotnet test TaskTracker.sln --nologo
